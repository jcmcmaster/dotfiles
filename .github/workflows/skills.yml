name: Skill Installer Tests

on:
  pull_request:
    paths:
      - "skills/**"
      - ".github/workflows/skills.yml"
  push:
    branches: [master]
    paths:
      - "skills/**"
      - ".github/workflows/skills.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: "10.0.x"
      - name: Run installer tests
        run: dotnet fsi ./skills/init.Tests.fsx
      - name: Preview skill installs
        run: dotnet fsi ./skills/init.fsx -- --what-if
